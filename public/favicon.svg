<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920"/>
      <stop offset="50%" stop-color="#0f1015"/>
      <stop offset="100%" stop-color="#08080b"/>
    </linearGradient>

    <!-- Top Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Left Pillar: Titanium White to Cool Silver -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Momentum Loop: Electric Emerald to Vivid Cyan to Tech Indigo -->
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="38%" stop-color="#10b981"/>
      <stop offset="78%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Ambient Emerald Radial Glow -->
    <radialGradient id="ambGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Beacon Pulse Halo -->
    <radialGradient id="beaconHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="20" y="20" width="472" height="472" rx="114" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="114" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  <rect x="22" y="22" width="468" height="468" rx="112" stroke="url(#rimGrad)" stroke-width="1.5"/>

  <!-- Radial Light Field -->
  <circle cx="268" cy="224" r="150" fill="url(#ambGlow)"/>

  <!-- Monogram Glyph: "P" for PACE -->
  <!-- Left Pillar -->
  <rect x="130" y="108" width="62" height="296" rx="31" fill="url(#stemGrad)"/>

  <!-- Dynamic Momentum Loop -->
  <path d="M192 108H288C350.96 108 402 159.04 402 222C402 284.96 350.96 336 288 336H206C197.163 336 190 328.837 190 320V294C190 285.163 197.163 278 206 278H284C314.928 278 340 252.928 340 222C340 191.072 314.928 166 284 166H192V108Z" fill="url(#loopGrad)"/>

  <!-- Pulse Star / Growth Beacon inside the loop -->
  <circle cx="262" cy="222" r="28" fill="url(#beaconHalo)"/>
  <circle cx="262" cy="222" r="14" fill="#34d399"/>
  <path d="M262 198L265.5 218.5L286 222L265.5 225.5L262 246L258.5 225.5L238 222L258.5 218.5L262 198Z" fill="#ffffff"/>
</svg>