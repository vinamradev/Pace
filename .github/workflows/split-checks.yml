name: PACE Split Feature Checks

on:
  push:
    branches:
      - feature/split-expenses
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build PACE frontend
        run: npm run build
      - name: Test split calculations and balances
        run: npm --prefix server run test:split
